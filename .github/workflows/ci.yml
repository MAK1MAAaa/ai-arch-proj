name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  UV_PYTHON_DOWNLOADS: never
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Test without model or data downloads
        run: uv run --no-sync pytest
      - name: Install workflow regression test dependencies
        run: npm ci --prefix scripts/workflow-tests --ignore-scripts
      - name: Test workflow pagination and approval guards
        run: npm test --prefix scripts/workflow-tests

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks]
    if: ${{ always() }}
    steps:
      - name: Require successful checks on every platform
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

  bootstrap-approve:
    name: Bootstrap approval for PR 1
    needs: [quality-gate]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1 &&
      github.actor == 'MAK1MAAaa' &&
      github.repository == 'MAK1MAAaa/ai-arch-proj' &&
      github.event.pull_request.user.login == 'MAK1MAAaa' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/dev' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '0fa4092765566cf8d155a4801fa481648b7db6f5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Approve PR 1 after the current quality gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const repository = 'MAK1MAAaa/ai-arch-proj';
            const trustedActor = 'MAK1MAAaa';
            const initialMain = '0fa4092765566cf8d155a4801fa481648b7db6f5';
            const expectedAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const eventPr = context.payload.pull_request;
            const isMatchingPullRequest = (pr) => (
              `${owner}/${repo}` === repository && pr.number === 1 &&
              pr.state === 'open' && !pr.draft && pr.user?.login === trustedActor &&
              pr.head.repo?.full_name === repository && pr.head.ref === 'feature/dev' &&
              pr.head.sha === eventPr.head.sha &&
              pr.base.repo?.full_name === repository && pr.base.ref === 'main' &&
              pr.base.sha === initialMain
            );
            if (context.actor !== trustedActor || !isMatchingPullRequest(eventPr)) {
              core.setFailed('Bootstrap approval is restricted to the initial trusted PR.');
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const isCurrentRun = (candidate) => (
              candidate.id === context.runId && candidate.run_attempt === expectedAttempt &&
              candidate.event === 'pull_request' && candidate.head_sha === eventPr.head.sha &&
              candidate.head_repository?.full_name === repository &&
              candidate.head_branch === 'feature/dev' &&
              candidate.actor?.login === trustedActor &&
              candidate.triggering_actor?.login === trustedActor &&
              candidate.path?.split('@')[0] === '.github/workflows/ci.yml' &&
              candidate.status === 'in_progress'
            );
            if (!isCurrentRun(run)) {
              core.setFailed('Bootstrap approval requires this current CI run and attempt.');
              return;
            }
            const isLatestRun = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: run.workflow_id,
                branch: 'feature/dev', event: 'pull_request', per_page: 100,
              });
              const latest = runs
                .filter((candidate) => candidate.head_repository?.full_name === repository)
                .sort((left, right) => right.run_number - left.run_number ||
                  right.run_attempt - left.run_attempt || right.id - left.id)[0];
              return latest !== undefined && isCurrentRun(latest);
            };
            if (!await isLatestRun()) {
              core.setFailed('A newer CI run supersedes the bootstrap approval.');
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              { owner, repo, run_id: run.id, attempt_number: expectedAttempt, per_page: 100 },
            );
            const gates = jobs.filter((job) => job.name === 'quality-gate');
            if (gates.length !== 1 || gates[0].status !== 'completed' ||
                gates[0].conclusion !== 'success') {
              core.setFailed('All platform checks must pass before bootstrap approval.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: 1, per_page: 100,
            });
            if (reviews.some((review) => review.user?.login === 'github-actions[bot]' &&
                review.state === 'APPROVED' && review.commit_id === run.head_sha)) {
              core.info('PR 1 already has approval for the current commit.');
              return;
            }
            if (!await isLatestRun()) {
              core.setFailed('A newer run appeared before bootstrap approval.');
              return;
            }
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: 1,
            });
            if (!isMatchingPullRequest(current)) {
              core.setFailed('The pull request changed before bootstrap approval.');
              return;
            }
            await github.rest.pulls.createReview({
              owner, repo, pull_number: 1, event: 'APPROVE', commit_id: run.head_sha,
              body: `首个 PR 引导审批：提交 \`${run.head_sha}\` 的跨平台 ` +
                `[quality-gate](${run.html_url}) 已通过，后续 PR 使用修复后的独立审批工作流。`,
            });
